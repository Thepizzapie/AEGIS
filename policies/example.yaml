# Aegis USER policy.
#
# Built-in security rules run automatically BEFORE this file (credential/exfil/
# persistence containment, destructive-git, recursive-delete, and Aegis
# self-protection) — you don't write those. This file is for YOUR rules.
#
# First matching rule by priority wins; if nothing matches, default_action
# applies. Rules can match with glob `argument_patterns:` or `regex:`.
# Check with: aegis validate

# Identity & confinement (optional, repo-level defaults):
#   agent_label: ci-bot     # label records when no AEGIS_AGENT_NAME is set
#   project: .              # hard-block Edit/Write outside this repo
#   workspace: { allow: ["../shared"] }   # widen the confined root

# Forced install review (optional). Built in and ON by default (mode: ask):
# a dependency install is denied until its manifest (requirements.txt,
# package.json + lock, pyproject.toml, ...) has been FULLY READ this session,
# then surfaced as a human ask with a digest. Tune it here:
#   install_review:
#     mode: ask            # off | monitor (log-only) | ask (default)
#     deep: false          # also require reading setup.py / postinstall scripts
#     require_pinned: false # deny unpinned specs (force exact == / a lockfile)
#     allow: []            # regexes on the command that skip the gate

# curl/wget config hijack (optional tuning). Built in and ON by default
# (mode: ask): a write to ~/.curlrc / _curlrc / $XDG_CONFIG_HOME/curlrc /
# ~/.wgetrc / /etc/wgetrc / wget2rc that adds anything beyond routine
# transfer options (silent, fail, retries, timeouts, user-agent, redirects)
# -- proxy, insecure, connect-to, trace, data=@file, url, engine, wget
# https_proxy / check_certificate=off / post_file / use_askpass -- asks a
# human first. A human pre-approves with AEGIS_ALLOW_HTTP_CLIENT_CONFIG=1
# or a trailing '# aegis-allow' on a shell command; a spawned agent cannot.
#   http_client_config:
#     mode: ask            # deny | ask (default) | monitor | off
#     allow: ['^/ci/\.curlrc$']   # regexes on the path/command that skip it

# Editor startup/init hijack (optional tuning). Built in and ON by default
# (mode: ask): ANY write to a Vim/Neovim/Emacs/Kakoune/micro/Helix init
# file or runtime directory (~/.vimrc, ~/.vim/**, ~/.config/nvim/**,
# ~/.local/share/nvim/**, ~/.emacs.d/**, .dir-locals.el, .nvim.lua, ...)
# asks a human first -- the editor runs it as code on its next launch,
# including the one `git commit` starts. A human pre-approves with
# AEGIS_ALLOW_EDITOR_STARTUP=1 or a trailing '# aegis-allow' on a shell
# command; a spawned agent cannot.
#   editor_startup:
#     mode: ask            # deny | ask (default) | monitor | off
#     allow: ['^/home/[^/]+/dotfiles/']   # regexes on the (normalized) path

# mise / asdf config exec hijack (optional tuning). Built in and ON by
# default (mode: ask): a write to mise.toml/.mise.toml/~/.config/mise/
# config.toml/.tool-versions that ADDS a hook, env._.source/_.path,
# an exec-bearing env var (LD_PRELOAD, NODE_OPTIONS, *_PROXY, ...), a
# template exec(), a plugin, a code-fetching tool backend (ubi:/npm:/...)
# or a trust-removing setting asks a human first; routine edits
# (node = "22") pass. `mise trust`, `mise settings set
# trusted_config_paths ...`, `mise plugins install` and writes into the
# mise/asdf plugin/shim dirs, mise's trust store, mise.lock, `mise -y`,
# `CI=` on a mise command and assigned MISE_* settings ask too. A human pre-approves with
# AEGIS_ALLOW_MISE_EXEC=1 or a trailing '# aegis-allow'; a spawned agent
# cannot. Shell `allow` regexes must match the WHOLE command.
#   mise_exec:
#     mode: ask            # deny | ask (default) | monitor | off
#     allow: ['^/ci/repo/mise\.toml$', 'mise trust /ci/repo']

# Bun bunfig.toml exec / package-source hijack (optional tuning). Built in
# and ON by default (mode: ask): a write to bunfig.toml / ~/.bunfig.toml
# that ADDS `preload`, `[test] preload`, plugins, an install security
# scanner, a `[run] shell`, a non-official registry/scope, `ca`/`cafile`,
# or an unknown key asks a human first; routine edits ([test] coverage,
# [install] exact) pass. A human pre-approves with AEGIS_ALLOW_BUNFIG_EXEC=1
# or a trailing '# aegis-allow'; a spawned agent cannot. Shell `allow`
# regexes must match the WHOLE command.
#   bunfig_exec:
#     mode: ask            # deny | ask (default) | monitor | off
#     allow: ['^/ci/repo/bunfig\.toml$']

default_action: allow
on_error: allow

rules:
  # Admins may do anything (highest priority).
  - name: admin-allow-all
    priority: 300
    action: allow
    tools: ["*"]
    roles: [admin]

  # Never read or write secret files.
  - name: block-secret-files
    priority: 150
    action: deny
    actions: [read, edit, write]
    argument_patterns:
      file_path: "*.env*"
    message: "Reading/writing .env files is blocked by Aegis"

  # Confirm before anything that touches prod (regex example).
  - name: confirm-prod
    priority: 120
    action: ask
    actions: [shell]
    regex:
      command: "\\b(kubectl|helm)\\b.*\\bprod\\b|terraform\\s+apply"
    message: "Confirm before touching prod infrastructure"
